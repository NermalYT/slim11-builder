name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install wimlib (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y wimtools
      - name: Install wimlib (macOS)
        if: runner.os == 'macOS'
        run: brew install wimlib
      - name: Install wimlib (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://wimlib.net/downloads/wimlib-1.14.4-windows-x86_64-bin.zip -OutFile wimlib.zip
          Expand-Archive wimlib.zip -DestinationPath tools/wimlib
      - name: Install
        run: python -m pip install -e .
      - name: Test
        run: python -m unittest discover -s tests -v

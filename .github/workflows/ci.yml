name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install wimlib (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y wimtools
      - name: Install wimlib (macOS)
        if: runner.os == 'macOS'
        run: brew install wimlib
      - name: Install wimlib (Windows)
        # wimlib.net is sometimes unreachable from runners; the end-to-end test
        # is skipped when wimlib is missing, the rest still runs.
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          foreach ($i in 1..3) {
            try {
              Invoke-WebRequest https://wimlib.net/downloads/wimlib-1.14.4-windows-x86_64-bin.zip -OutFile wimlib.zip -TimeoutSec 60
              break
            } catch { Write-Warning "Attempt $i failed: $_"; Start-Sleep 10 }
          }
          Expand-Archive wimlib.zip -DestinationPath tools/wimlib
      - name: Install
        run: python -m pip install -e .
      - name: Test
        run: python -m unittest discover -s tests -v

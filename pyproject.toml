[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slim11-builder"
version = "0.1.1"
description = "Build a smaller Windows 11 ISO on Linux, macOS or Windows. Inspired by ntdev's Tiny11 Builder."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["pycdlib>=1.14"]
classifiers = [
  "Environment :: Web Environment",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
]

[project.scripts]
slim11 = "slim11.cli:main"

[project.urls]
"Inspired by" = "https://github.com/ntdevlabs/tiny11builder"

[tool.setuptools]
packages = ["slim11"]

[tool.setuptools.package-data]
slim11 = ["web/*"]
